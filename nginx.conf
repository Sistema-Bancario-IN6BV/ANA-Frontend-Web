server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA de React Router: cualquier ruta que no sea un archivo real cae de
    # vuelta a index.html, para que el enrutado del lado del cliente decida
    # qué mostrar. Sin esto, refrescar /alguna-ruta daría 404 en Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
